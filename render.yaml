services:
  - type: web
    name: telecomiq-backend
    env: python
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python start_backend.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true

